<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스토브 실행취소 - 설정</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #333;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .setting-group {
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid #eee;
    }

    .setting-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .setting-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .setting-description {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    input[type="number"],
    input[type="range"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    input[type="range"] {
      padding: 0;
    }

    .range-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-value {
      min-width: 70px;
      text-align: right;
      font-weight: 600;
      color: #007bff;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .save-button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-button:hover {
      background: #0056b3;
    }

    .save-status {
      text-align: center;
      margin-top: 12px;
      color: #28a745;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-status.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ 스토브 실행취소 설정</h1>
    <p class="subtitle">에디터 실행취소 기능을 사용자 정의하세요</p>

    <div class="setting-group">
      <label class="setting-label">히스토리 최대 크기</label>
      <p class="setting-description">저장할 수 있는 최대 실행취소 개수 (기본: 150개)</p>
      <div class="range-container">
        <input type="range" id="maxHistorySize" min="50" max="500" step="10" value="150">
        <span class="range-value" id="maxHistorySizeValue">150개</span>
      </div>
    </div>

    <div class="setting-group">
      <label class="setting-label">저장 지연 시간 (Debounce)</label>
      <p class="setting-description">입력 후 히스토리를 저장하기까지의 대기 시간 (기본: 100ms)</p>
      <div class="range-container">
        <input type="range" id="debounceTime" min="0" max="1000" step="50" value="100">
        <span class="range-value" id="debounceTimeValue">100ms</span>
      </div>
    </div>

    <div class="setting-group">
      <label class="setting-label">UI 버튼 표시</label>
      <p class="setting-description">에디터에 실행취소/다시실행 버튼 표시</p>
      <div class="checkbox-container">
        <input type="checkbox" id="showUIButtons" checked>
        <label for="showUIButtons">버튼 표시</label>
      </div>
    </div>

    <button class="save-button" id="saveButton">설정 저장</button>
    <div class="save-status" id="saveStatus">✓ 설정이 저장되었습니다</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
